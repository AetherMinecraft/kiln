format: kiln.brick/v1
metadata:
  id: nanolimbo
  name: NanoLimbo
  description: Lightweight, high-performance Minecraft limbo server for proxy fallback.
  game: Minecraft
  author: Nan1t
  documentation: https://github.com/Nan1t/NanoLimbo
  tags: [minecraft, java, proxy, limbo]
variables:
  version:
    type: string
    label: NanoLimbo version
    description: NanoLimbo release to install.
    required: true
    default: "1.13.0"
    rules: { pattern: "^[0-9]+(?:\\.[0-9]+){1,3}$", maxLength: 32 }
  memory:
    type: string
    label: Container memory
    description: Total memory limit; Java uses up to 75% for its heap.
    required: true
    default: 512M
    rules: { pattern: "^[0-9]+[MG]$", maxLength: 12 }
runtime:
  image: ghcr.io/kiln-site/bricks-java:21
  name: Java 21
  environment:
    KILN_IMPLEMENTATION: nanolimbo
    KILN_VERSION: "{{ variables.version }}"
    KILN_ARTIFACT_URL: "https://github.com/Nan1t/NanoLimbo/releases/download/v{{ variables.version }}/NanoLimbo.jar"
    KILN_ARTIFACT_FILE: NanoLimbo.jar
    KILN_NANOLIMBO_SETTINGS_URL: "https://raw.githubusercontent.com/Nan1t/NanoLimbo/v{{ variables.version }}/src/main/resources/settings.yml"
    KILN_INSTALLATION_MARKER: .kiln-ember-installed
    KILN_SERVER_KIND: application
    KILN_SERVER_ARGS: ""
    KILN_JAVA_MAX_RAM_PERCENTAGE: "75.0"
    MIN_RAM: 128M
  resources:
    memory: "{{ variables.memory }}"
    memoryReservation: "{{ variables.memory }}"
    pids: 512
  storage: { mount: /server }
console:
  stopCommands: [stop]
network:
  mode: minecraft-backend
  primaryPort: game
  hostname: "{{ brick.id }}"
  ports:
    - { name: game, container: 25565, protocol: tcp }
constraints:
  architectures: [amd64, arm64]
